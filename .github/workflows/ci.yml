name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Auditoría en navegador (axe, teclado, reduced-motion, viewports)
        run: |
          npx playwright install --with-deps chromium
          npm run start & 
          npx wait-on http://localhost:3000 || sleep 10
          npm run qa
